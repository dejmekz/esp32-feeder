[env:esp32-c3-devkitm-1]
; Pinned version: newer platforms (Arduino 3.x / IDF 5) change APIs,
; e.g. esp_task_wdt_init(), and the build would fail.
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
build_flags =
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
	-I${PROJECT_INCLUDE_DIR}
;    -DUSING_MOTOR=true
;build_flags = -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_NONE
;board_build.partitions = min_spiffs.csv


framework = arduino
lib_deps =
	knolleary/PubSubClient
	bblanchon/ArduinoJson
	beegee-tokyo/DHT sensor library for ESPx
	chrisjoyce911/esp32FOTA@^0.2.9
	dlloydev/ESP32 ESP32S2 AnalogWrite@^5.0.2
monitor_speed = 115200

; Runs the pure-logic unit tests on the host, no ESP32 hardware needed.
; Hardware-dependent libs are excluded and Arduino.h/DHTesp.h are
; provided as minimal stubs so feeder.h/feeder.cpp compile natively.
[env:native]
platform = native
test_framework = unity
build_flags = -Itest_native_stubs
lib_ignore = MotorControl, Button, LedPin
